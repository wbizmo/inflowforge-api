services:
  postgres:
    image: postgres:16
    container_name: inflowforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inflowforge
      POSTGRES_PASSWORD: inflowforge_password
      POSTGRES_DB: inflowforge_db
    ports:
      - "5432:5432"
    volumes:
      - inflowforge_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inflowforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  inflowforge_postgres_data: