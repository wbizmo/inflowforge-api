name: Prepare inFlowForge v1.0.1

on:
  push:
    branches:
      - release/1.0.1

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm version 1.0.1 --no-git-tag-version
      - run: node .github/scripts/bump-v1.0.1.mjs
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app.ts
          git commit -m "release: bump inFlowForge API to 1.0.1"
          git push origin HEAD:release/1.0.1
