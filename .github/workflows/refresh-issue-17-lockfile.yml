name: Refresh issue 17 lockfile
on:
  push:
    branches: [fix/17-prisma-transitives]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'package-lock.json';
            const content = fs.readFileSync(path).toString('base64');
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'fix/17-prisma-transitives'});
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'security: refresh Prisma tooling lockfile', content, sha: current.data.sha, branch: 'fix/17-prisma-transitives'});
