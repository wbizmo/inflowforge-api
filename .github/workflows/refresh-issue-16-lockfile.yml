name: Refresh issue 16 lockfile
on:
  push:
    branches: [fix/16-swagger-static]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'package-lock.json';
            const content = fs.readFileSync(path).toString('base64');
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'fix/16-swagger-static'});
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'security: refresh Swagger UI lockfile', content, sha: current.data.sha, branch: 'fix/16-swagger-static'});
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
