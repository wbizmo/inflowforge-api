name: Verify issue 4
on:
  push:
    branches: [fix/4-fastify-security]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: inflowforge, POSTGRES_PASSWORD: inflowforge_password, POSTGRES_DB: inflowforge_db}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U inflowforge -d inflowforge_db" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://inflowforge:inflowforge_password@localhost:5432/inflowforge_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ADMIN_TOKEN: dev_admin_secret_12345
      WEBHOOK_TRIGGER_SECRET: ci_webhook_secret_123456789
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/4-fastify-security}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: refresh Fastify lockfile"
            git push origin HEAD:fix/4-fastify-security
          fi
      - run: npm ci
      - name: Verify patched Fastify
        run: node -e "const [a,b,c]=require('./node_modules/fastify/package.json').version.split('.').map(Number); if(a!==5||b<12||(b===12&&c<1)) process.exit(1)"
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsx prisma/seed/dev.ts
      - run: npm run build
      - run: npm run lint
      - run: npm test
