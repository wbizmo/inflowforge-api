name: Patch issue 9 condition validation

on:
  push:
    branches:
      - fix/9-condition-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch-issue-9.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workflows/workflow.routes.ts
          git commit -m "fix: align condition validation with documented shapes"
          git push origin HEAD:fix/9-condition-validation
